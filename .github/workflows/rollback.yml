name: Roll back production package
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main deployment run containing the package to restore
        required: true
        type: string
      schema_compatible:
        description: The retained application is compatible with the current database schema
        required: true
        default: false
        type: boolean
concurrency:
  group: faithtech-production
permissions:
  contents: read
  actions: read
jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && inputs.schema_compatible
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      AZURE_WEBAPP_URL: ${{ vars.AZURE_WEBAPP_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate successful release provenance and download
        shell: pwsh
        run: |
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid source run.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source run.' }
          if ($run.conclusion -ne 'success' -or $run.event -ne 'push' -or $run.head_branch -ne 'main' -or $run.path -ne '.github/workflows/ci.yml') { throw 'Choose a successful main deployment run.' }
          gh run download $env:SOURCE_RUN --name "release-$($run.head_sha)" --dir artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact unavailable.' }
          $manifest = Get-Content artifacts/release/release.json -Raw | ConvertFrom-Json
          if ($manifest.revision -ne $run.head_sha) { throw 'Artifact does not match source run.' }
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore and verify the retained package
        shell: pwsh
        env:
          SMOKE_PASSCODE: ${{ secrets.SMOKE_PASSCODE }}
        run: ./eng/scripts/deploy-release.ps1 -Rollback
