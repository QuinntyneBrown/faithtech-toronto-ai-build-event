name: CI and production deployment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: faithtech-${{ github.event_name == 'push' && 'production' || github.ref }}
  queue: max
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'backend/**/packages.lock.json'
      - name: Install locked dependencies and audit
        run: |
          npm install --global npm@10.9.4
          for project in frontend design-system; do
            npm --prefix "$project" ci
            npm --prefix "$project" audit --audit-level=high
          done
          dotnet restore backend/FaithTechTorontoAiBuildEvent.slnx --locked-mode
      - name: Build production applications
        run: |
          npm --prefix frontend run build
          npm --prefix design-system run build
          dotnet build backend/FaithTechTorontoAiBuildEvent.slnx -c Release --no-restore
      - name: Start disposable SQL Server
        run: |
          password="Ft9!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "FAITHTECH_TEST_SQL=Server=localhost,1433;User ID=sa;Password=$password;TrustServerCertificate=True;Encrypt=True" >> "$GITHUB_ENV"
          export MSSQL_SA_PASSWORD="$password"
          docker run -d --name faithtech-ci-sql -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..60}; do
            if docker exec -e SQLCMDPASSWORD="$password" faithtech-ci-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: API acceptance tests
        run: |
          dotnet pack backend/src/FaithTechTorontoAiBuildEvent.Provisioning -c Release --no-build --output artifacts/operator-test-package
          dotnet tool install FaithTechTorontoAiBuildEvent.Provisioning --version 1.0.0 --tool-path "$RUNNER_TEMP/faithtech-operator" --add-source artifacts/operator-test-package --ignore-failed-sources
          export FAITHTECH_TEST_TOOL="$RUNNER_TEMP/faithtech-operator/faithtech-admin"
          dotnet test backend/FaithTechTorontoAiBuildEvent.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Recording and release-helper acceptance tests
        run: |
          node --test e2e/demo/*.test.mjs
          node --test eng/scripts/*.test.mjs
      - name: Package immutable release
        shell: pwsh
        run: ./eng/scripts/package-release.ps1 -Revision '${{ github.sha }}'
      - name: Verify packaged application against disposable SQL
        shell: pwsh
        run: ./eng/scripts/verify-package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: |
            artifacts/release/web.zip
            artifacts/release/release.json
            artifacts/release/provisioning/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ github.run_id }}
          path: |
            artifacts/test-results/
            artifacts/package.*.log
          retention-days: 90
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f faithtech-ci-sql || true
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install locked dependencies and audit
        run: |
          npm install --global npm@10.9.4
          for project in frontend e2e; do
            npm --prefix "$project" ci
            npm --prefix "$project" audit --audit-level=high
          done
      - name: Install browser
        working-directory: e2e
        run: npx playwright install --with-deps chrome
      - name: Application browser acceptance tests
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/2 --reporter=list,html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-${{ matrix.shard }}-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 90
  verify:
    if: always()
    needs: [release, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job to pass
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$RELEASE_RESULT" = success && test "$BROWSER_RESULT" = success
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.AZURE_WEBAPP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
      AZURE_WEBAPP_URL: ${{ vars.AZURE_WEBAPP_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.sha }}
          path: artifacts/release
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        id: azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Migrate, deploy, and verify
        shell: pwsh
        env:
          MIGRATION_CONNECTION_STRING: ${{ secrets.MIGRATION_CONNECTION_STRING }}
          PRODUCTION_DIGEST_KEY: ${{ secrets.PRODUCTION_DIGEST_KEY }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: ./eng/scripts/deploy-release.ps1
      - name: Ensure temporary migration access is removed
        if: always() && steps.azure-login.outcome == 'success'
        shell: pwsh
        run: |
          $rule = "github-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $rules = az sql server firewall-rule list -g $env:AZURE_RESOURCE_GROUP -s $env:AZURE_SQL_SERVER --only-show-errors -o json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify SQL firewall cleanup.' }
          if ($rules | Where-Object name -eq $rule) {
            az sql server firewall-rule delete -g $env:AZURE_RESOURCE_GROUP -s $env:AZURE_SQL_SERVER -n $rule --only-show-errors
            if ($LASTEXITCODE -ne 0) { throw 'Temporary SQL firewall cleanup failed.' }
          }
