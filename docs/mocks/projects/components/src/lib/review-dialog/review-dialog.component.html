<dialog
  #dialog
  [attr.aria-labelledby]="headingId"
  (cancel)="closed.emit()"
  (close)="closed.emit()"
>
  <cs-dialog-shell>
    <div csDialogTitle class="dialog-heading">
      <h2 [id]="headingId">{{ title() }}</h2>
      <button
        csButton="ghost"
        type="button"
        aria-label="Close dialog"
        (click)="closed.emit()"
      >
        ✕
      </button>
    </div>
    <ng-content />
  </cs-dialog-shell>
</dialog>
