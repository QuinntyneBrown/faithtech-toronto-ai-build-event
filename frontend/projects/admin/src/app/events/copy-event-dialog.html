<dialog #dialog aria-labelledby="copy-title" (cancel)="$event.preventDefault(); close()">
  <form (ngSubmit)="save()" [attr.aria-busy]="busy()">
    <h2 id="copy-title">Copy event</h2>
    <p>Creates a new draft with this event's content, venue and schedule, shifted to a new start. Registrations and credentials are never copied.</p>
    @if (error()) { <p id="copy-error" role="alert">{{ error() }}</p> }
    <label>New start date and time<input #startInput name="start" type="datetime-local" [ngModel]="local()" (ngModelChange)="local.set($event)" [readonly]="uncertain()" [attr.aria-invalid]="fieldError() ? 'true' : null" [attr.aria-describedby]="fieldError() ? 'copy-error' : null" autofocus></label>
    <label>New start UTC offset (minutes)<input name="startOffset" type="number" [ngModel]="offsetMinutes()" (ngModelChange)="offsetMinutes.set($event)" [readonly]="uncertain()"></label>
    <div class="actions"><button type="button" (click)="close()" [disabled]="busy() || uncertain()">Cancel</button><button type="submit" [disabled]="busy() || !local()">{{ busy() ? 'Copying…' : uncertain() ? 'Retry copy' : 'Create copy' }}</button></div>
  </form>
</dialog>
