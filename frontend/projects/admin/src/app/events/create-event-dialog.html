<dialog #dialog aria-labelledby="create-title" (cancel)="$event.preventDefault(); requestClose()">
  @if (discard()) {
    <h2 id="create-title">Discard draft?</h2><p>Your unsaved event title will be cleared.</p>
    <div class="actions"><button #keepButton (click)="keepEditing()">Keep editing</button><button (click)="close()">Discard</button></div>
  } @else {
    <form (ngSubmit)="save()" [attr.aria-busy]="busy()">
      <h2 id="create-title">Create event</h2><p>You can add the remaining details before publishing.</p>
      @if (error()) { <p id="create-error" role="alert">{{ error() }}</p> }
      <label for="event-title">Event title</label>
      <input #titleInput id="event-title" name="title" [ngModel]="title()" (ngModelChange)="title.set($event)" [readonly]="uncertain()" [attr.aria-describedby]="error() ? 'create-error' : null" autofocus>
      <div class="actions"><button type="button" (click)="requestClose()" [disabled]="busy() || uncertain()">Cancel</button><button type="submit" [disabled]="busy()">{{ busy() ? 'Saving…' : uncertain() ? 'Retry save' : 'Save draft' }}</button></div>
    </form>
  }
</dialog>
