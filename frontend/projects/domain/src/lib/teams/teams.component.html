@if (event.loading()) {
  <cs-card><p>Forming teams…</p></cs-card>
} @else if (event.state(); as state) {
  <h1>Team selection</h1>
  @if (administrator.active()) {
    @if (flow.error(); as error) { <p role="alert">{{ error }}</p> }
    <button csButton type="button" (click)="advance()" [disabled]="!event.connected() || flow.loading()">Open raffle</button>
  }
  @if (teams.error(); as error) { <p role="alert">{{ error }}</p> }
  <cs-team-board
    [groups]="groups()"
    [members]="members()"
    [projects]="projects()"
    [editable]="administrator.active()"
    [disabled]="!event.connected() || teams.loading()"
    [currentMember]="entry.confirmation()?.participantId ?? ''"
    (moved)="move($event)"
    (assigned)="assignProject($event)"
    (newTeamRequested)="createTeam($event)"
  />
}
