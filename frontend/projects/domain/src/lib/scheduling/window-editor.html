<fieldset><legend>{{ label() }} window</legend>
  <label class="toggle"><input type="checkbox" [ngModel]="!!value()" (ngModelChange)="enable($event)" [ngModelOptions]="{standalone: true}">Enable {{ label().toLowerCase() }}</label>
  @if (value(); as window) {
    <label>{{ label() }} start<input [id]="id('start')" [attr.aria-invalid]="error('start') ? 'true' : null" [attr.aria-describedby]="error('start') ? id('start-error') : null" type="datetime-local" [ngModel]="window.start?.local || ''" (ngModelChange)="time('start', $event)" [ngModelOptions]="{standalone: true}"></label>
    <label>{{ label() }} start UTC offset (minutes)<input [attr.aria-describedby]="error('start') ? id('start-error') : null" type="number" [ngModel]="window.start?.offsetMinutes" (ngModelChange)="offset('start', $event)" [ngModelOptions]="{standalone: true}"></label>
    @if (error('start'); as message) { <p [id]="id('start-error')">{{ message }}</p> }
    <label>{{ label() }} end<input [id]="id('end')" [attr.aria-invalid]="error('end') ? 'true' : null" [attr.aria-describedby]="error('end') ? id('end-error') : null" type="datetime-local" [ngModel]="window.end?.local || ''" (ngModelChange)="time('end', $event)" [ngModelOptions]="{standalone: true}"></label>
    <label>{{ label() }} end UTC offset (minutes)<input [attr.aria-describedby]="error('end') ? id('end-error') : null" type="number" [ngModel]="window.end?.offsetMinutes" (ngModelChange)="offset('end', $event)" [ngModelOptions]="{standalone: true}"></label>
    @if (error('end'); as message) { <p [id]="id('end-error')">{{ message }}</p> }
  } @else { <p>{{ label() }} is disabled.</p> }
</fieldset>
