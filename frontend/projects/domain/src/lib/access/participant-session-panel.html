@if (state(); as session) {
  @if (showDetails()) {
  <p role="status">You are signed in.</p>
  <div class="actions"><button (click)="signOut()">Sign out</button></div>
  }
  <ng-content />
} @else {
  @if (error()) { <p role="alert">{{ error() }}</p><button (click)="pendingSignOut() ? signOut() : refresh()">Retry</button> }
  @else { <p role="status">{{ pendingSignOut() ? 'Signing out…' : 'Verifying your session…' }}</p> }
}
